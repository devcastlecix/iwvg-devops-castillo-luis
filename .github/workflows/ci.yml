name: CI
on:
  push:
    branches: [ 'develop', 'release-*' ]
jobs:
  devops:
    name: Test - Unit & Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Unit & Integration Tests
        run: |
          mvn clean
          mvn -B verify
